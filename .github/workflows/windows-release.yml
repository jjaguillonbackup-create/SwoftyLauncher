name: Windows release

# Compila solo la versión de Windows del launcher y la publica como un release de GitHub.
# Se lanza a mano desde la pestaña Actions > "Windows release" > "Run workflow".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Nombre del tag/release que se va a crear (por ejemplo v0.2.111)
        required: true
      prerelease:
        description: Marcarlo como pre-release
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  # Los DLL que se cargan dentro del juego (version.dll, swofty_core.dll...). Zig los compila como DLL de
  # Windows; esto corre en una máquina de GitHub, no en tu PC.
  native:
    name: Loader (DLL de Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Ninja
        uses: ./.github/actions/ninja

      - name: Build
        run: native/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: native/dist/
          if-no-files-found: error

  windows:
    name: Launcher para Windows
    needs: native
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # El toolchain que fija rust-toolchain.toml (1.95.0).
      - uses: ./.github/actions/setup-rust

      # Sin SWOFTY_LOGS_URL / SWOFTY_USAGE_URL / SWOFTY_ADS_URL: tu build no manda logs, reportes de uso
      # ni muestra anuncios de los servidores oficiales.
      - name: Build
        run: cargo build --release -p swofty-cli -p swofty-launcher

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build Swofty UI
        shell: bash
        run: |
          python -m pip install pyinstaller==6.22.3
          python tools/swofty-ui/build.py
          dist/swofty-ui/swofty-ui.exe --self-test

      - uses: actions/download-artifact@v4
        with:
          name: native
          path: native/dist

      # El compilador de shaders que trae el release oficial; se baja del repo original. Si no está,
      # el paquete sale sin la carpeta dxc y el workflow sigue.
      - name: Fetch dxc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_REPOSITORY=Swofty-Developments/SwoftyLauncher tools/dxc/fetch.sh dxc-windows-x86_64.tar.gz || echo "::warning::sin dxc"

      - name: Package
        shell: pwsh
        run: |
          $out = "swofty-launcher-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Force "$out/bin", "$out/loader" | Out-Null
          Copy-Item target/release/swofty.exe, target/release/swofty-launcher.exe, dist/swofty-ui/swofty-ui.exe "$out/bin/"
          Copy-Item -Recurse native/dist/* "$out/loader/"
          if (Test-Path dxc) { Copy-Item -Recurse dxc "$out/dxc" }
          Copy-Item LICENSE, README.md, THIRD_PARTY.md "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash.ToLower() + "  $out.zip" | Out-File -Encoding ascii SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            swofty-launcher-*.zip
            SHA256SUMS
